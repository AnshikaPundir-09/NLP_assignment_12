
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NLP Analysis Platform</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            text-align: center;

            padding: 45px 20px;

            border-radius: 0 0 18px 18px;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.12);
        }

        .title {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            opacity: 0.92;
        }

        .container {
            width: 90%;
            max-width: 1050px;
            margin: 35px auto;
        }

        .card {
            background: white;

            padding: 30px;

            margin-bottom: 25px;

            border-radius: 15px;

            box-shadow:
                0 4px 18px
                rgba(0, 0, 0, 0.08);
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: #4f46a5;
            margin-bottom: 18px;
        }

        .input-label {
            display: block;

            font-size: 15px;

            font-weight: 600;

            margin-bottom: 8px;

            color: #374151;
        }

        textarea {
            width: 100%;

            min-height: 160px;

            padding: 15px;

            resize: vertical;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            font-family: Arial, sans-serif;

            font-size: 15px;

            color: #1f2937;

            outline: none;
        }

        textarea:focus {
            border-color: #667eea;

            box-shadow:
                0 0 0 3px
                rgba(102, 126, 234, 0.12);
        }

        .operation-label {
            display: block;

            margin-top: 22px;

            margin-bottom: 8px;

            font-weight: 600;

            color: #374151;
        }

        select {
            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            background: white;

            font-size: 15px;

            color: #374151;

            cursor: pointer;

            outline: none;
        }

        select:focus {
            border-color: #667eea;
        }

        .button-area {
            margin-top: 22px;

            text-align: center;
        }

        .analyze-button {
            background: #667eea;

            color: white;

            border: none;

            padding: 13px 30px;

            border-radius: 9px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .analyze-button:hover {
            background: #5568d9;

            transform: translateY(-1px);
        }

        .result-card {
            display: none;
        }

        .result-title {
            font-size: 24px;

            font-weight: 600;

            color: #4f46a5;

            margin-bottom: 20px;
        }

        .operation-title {
            font-size: 20px;

            font-weight: 600;

            color: #374151;

            margin-bottom: 18px;
        }

        .token-container {
            display: flex;

            flex-wrap: wrap;

            gap: 9px;
        }

        .token {
            background: #eef2ff;

            color: #4338ca;

            border: 1px solid #c7d2fe;

            padding: 8px 12px;

            border-radius: 7px;

            font-size: 14px;
        }

        .text-result {
            background: #f8fafc;

            border: 1px solid #e2e8f0;

            padding: 15px;

            border-radius: 9px;

            line-height: 1.7;
        }

        .subheading {
            margin-top: 18px;

            margin-bottom: 9px;

            color: #374151;
        }

        .table-wrapper {
            width: 100%;

            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            background: white;
        }

        th {
            background: #eef2ff;

            color: #3730a3;

            font-weight: 600;
        }

        th,
        td {
            padding: 12px;

            border: 1px solid #e5e7eb;

            text-align: left;

            font-size: 14px;
        }

        tr:nth-child(even) {
            background: #fafafa;
        }

        .error {
            background: #fef2f2;

            border: 1px solid #fecaca;

            color: #b91c1c;

            padding: 15px;

            border-radius: 8px;
        }

        .loading {
            text-align: center;

            padding: 25px;

            color: #667eea;
        }

        footer {
            text-align: center;

            color: #6b7280;

            padding: 30px 20px;

            margin-top: 10px;

            border-top: 1px solid #e5e7eb;
        }

        footer strong {
            color: #4f46a5;
        }

        @media (max-width: 700px) {

            .title {
                font-size: 30px;
            }

            .subtitle {
                font-size: 15px;
            }

            .container {
                width: 94%;
            }

            .card {
                padding: 20px;
            }

            th,
            td {
                padding: 8px;

                font-size: 12px;
            }

        }

    </style>

</head>


<body>


<div class="header">

    <div class="title">
        🔎 NLP Explorer
    </div>

    <div class="subtitle">
        Interactive Natural Language Processing Dashboard
    </div>

</div>



<div class="container">


    <div class="card">

        <div class="section-title">
            📝 Enter Text
        </div>


        <label class="input-label">
            Input Text
        </label>


        <textarea
            id="textInput"
            placeholder="Enter an English sentence or paragraph..."
        >Microsoft was founded by Bill Gates and Paul Allen in 1975.</textarea>



        <label
            class="operation-label"
            for="operation"
        >
            Select NLP Operation
        </label>


        <select id="operation">

            <option value="Tokenization">
                Tokenization
            </option>

            <option value="Stopwords Removal">
                Stopwords Removal
            </option>

            <option value="POS Tagging">
                POS Tagging
            </option>

            <option value="Lemmatization">
                Lemmatization
            </option>

            <option value="Named-Entity Relationship">
                Named Entity Recognition
            </option>

            <option value="Stemming">
                Stemming
            </option>

            <option value="Dependencies">
                Relationship / Dependencies
            </option>

            <option value="POS Distribution">
                POS Distribution
            </option>

            <option value="Morphology">
                Morphology
            </option>

            <option value="Transformer Tokenization">
                Transformer Tokenization
            </option>

            <option value="Transformer Token IDs">
                Transformer Token IDs
            </option>

            <option value="Attention Mask">
                Attention Mask
            </option>

        </select>



        <div class="button-area">

            <button
                class="analyze-button"
                onclick="analyzeText()"
            >
                🔍 Analyze Text
            </button>

        </div>

    </div>



    <div
        class="card result-card"
        id="resultCard"
    >

        <div class="result-title">
            📊 Result
        </div>


        <div
            class="operation-title"
            id="operationTitle"
        >
        </div>


        <div id="result">
        </div>

    </div>

</div>



<footer>

    <strong>NLP Analysis Platform</strong>

    <br><br>

    Python • FastAPI • spaCy • NLTK • Transformers

</footer>



<script>


function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}



function createTable(
    headers,
    rows
) {

    let html = `
        <div class="table-wrapper">
        <table>
        <thead>
        <tr>
    `;


    headers.forEach(header => {

        html += `
            <th>
                ${escapeHTML(header)}
            </th>
        `;

    });


    html += `
        </tr>
        </thead>
        <tbody>
    `;


    rows.forEach(row => {

        html += "<tr>";


        row.forEach(value => {

            html += `
                <td>
                    ${escapeHTML(value)}
                </td>
            `;

        });


        html += "</tr>";

    });


    html += `
        </tbody>
        </table>
        </div>
    `;


    return html;
}



function createTokens(tokens) {

    if (
        !tokens ||
        tokens.length === 0
    ) {

        return `
            <div class="text-result">
                No results found.
            </div>
        `;

    }


    let html = `
        <div class="token-container">
    `;


    tokens.forEach(token => {

        html += `
            <span class="token">
                ${escapeHTML(token)}
            </span>
        `;

    });


    html += "</div>";


    return html;
}



async function analyzeText() {

    const text =
        document
        .getElementById("textInput")
        .value
        .trim();


    const operation =
        document
        .getElementById("operation")
        .value;


    if (!text) {

        showError(
            "Please enter some text."
        );

        return;
    }


    const resultCard =
        document.getElementById(
            "resultCard"
        );


    const operationTitle =
        document.getElementById(
            "operationTitle"
        );


    const result =
        document.getElementById(
            "result"
        );


    resultCard.style.display = "block";


    operationTitle.textContent =
        "⏳ Processing...";


    result.innerHTML = `
        <div class="loading">
            Analyzing your text...
        </div>
    `;


    try {

        const response =
            await fetch(
                "/analyze",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        text: text
                    })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            data.error
        ) {

            showError(
                data.error ||
                "Something went wrong."
            );

            return;
        }


        displayResult(
            data,
            operation,
            text
        );


    } catch (error) {

        showError(
            "Could not connect to the FastAPI server."
        );

    }

}



function displayResult(
    data,
    operation,
    text
) {

    const operationTitle =
        document.getElementById(
            "operationTitle"
        );


    const result =
        document.getElementById(
            "result"
        );


    if (
        operation ===
        "Tokenization"
    ) {

        operationTitle.textContent =
            "🔤 Tokenization";

        result.innerHTML =
            createTokens(
                data.words
            );
    }


    else if (
        operation ===
        "Stopwords Removal"
    ) {

        operationTitle.textContent =
            "🚫 Stopwords Removal";


        result.innerHTML = `

            <div class="subheading">
                <strong>
                    Original Text:
                </strong>
            </div>

            <div class="text-result">
                ${escapeHTML(text)}
            </div>

            <div class="subheading">
                <strong>
                    After Removing Stopwords:
                </strong>
            </div>

            <div class="text-result">
                ${escapeHTML(
                    data.stopwords_removed
                    .join(" ")
                )}
            </div>

        `;
    }


    else if (
        operation ===
        "POS Tagging"
    ) {

        operationTitle.textContent =
            "🏷️ POS Tagging";


        const rows =
            data.pos_tags.map(
                item => [

                    item.word,

                    item.pos,

                    item.detailed_tag,

                    item.lemma

                ]
            );


        result.innerHTML =
            createTable(
                [
                    "Word",
                    "POS",
                    "Detailed Tag",
                    "Lemma"
                ],
                rows
            );
    }


    else if (
        operation ===
        "Lemmatization"
    ) {

        operationTitle.textContent =
            "🌱 Lemmatization";


        const rows =
            data.lemmas.map(
                item => [

                    item.word,

                    item.lemma,

                    item.pos

                ]
            );


        result.innerHTML =
            createTable(
                [
                    "Original Word",
                    "Lemma",
                    "POS"
                ],
                rows
            );
    }


    else if (
        operation ===
        "Named-Entity Relationship"
    ) {

        operationTitle.textContent =
            "👤 Named Entity Recognition";


        if (
            data.entities.length === 0
        ) {

            result.innerHTML = `
                <div class="text-result">
                    No named entities found.
                </div>
            `;

            return;
        }


        const rows =
            data.entities.map(
                item => [

                    item.entity,

                    item.type,

                    item.description

                ]
            );


        result.innerHTML =
            createTable(
                [
                    "Entity",
                    "Label",
                    "Description"
                ],
                rows
            );
    }


    else if (
        operation ===
        "Stemming"
    ) {

        operationTitle.textContent =
            "✂️ Stemming";


        const rows =
            data.stemming.map(
                item => [

                    item.word,

                    item.stem

                ]
            );


        result.innerHTML =
            createTable(
                [
                    "Original Word",
                    "Stem"
                ],
                rows
            );
    }


    else if (
        operation ===
        "Dependencies"
    ) {

        operationTitle.textContent =
            "🔗 Relationship / Dependencies";


        const rows =
            data.dependencies.map(
                item => [

                    item.word,

                    item.pos,

                    item.dependency,

                    item.head

                ]
            );


        result.innerHTML =
            createTable(
                [
                    "Word",
                    "POS",
                    "Dependency",
                    "Head"
                ],
                rows
            );
    }


    else if (
        operation ===
        "POS Distribution"
    ) {

        operationTitle.textContent =
            "📊 POS Distribution";


        const rows =
            data.pos_distribution.map(
                item => [

                    item.pos,

                    item.frequency

                ]
            );


        result.innerHTML =
            createTable(
                [
                    "POS",
                    "Frequency"
                ],
                rows
            );
    }


    else if (
        operation ===
        "Morphology"
    ) {

        operationTitle.textContent =
            "🔬 Morphology";


        const rows =
            data.morphology.map(
                item => [

                    item.word,

                    item.lemma,

                    item.pos,

                    item.morphology

                ]
            );


        result.innerHTML =
            createTable(
                [
                    "Word",
                    "Lemma",
                    "POS",
                    "Morphology"
                ],
                rows
            );
    }


    else if (
        operation ===
        "Transformer Tokenization"
    ) {

        operationTitle.textContent =
            "🤖 Transformer Tokenization";


        result.innerHTML =
            createTokens(
                data.transformer_tokens
            );
    }


    else if (
        operation ===
        "Transformer Token IDs"
    ) {

        operationTitle.textContent =
            "🔢 Transformer Token IDs";


        result.innerHTML =
            createTokens(
                data.token_ids
            );
    }


    else if (
        operation ===
        "Attention Mask"
    ) {

        operationTitle.textContent =
            "🎯 Attention Mask";


        result.innerHTML =
            createTokens(
                data.attention_mask
            );
    }


    document
        .getElementById("resultCard")
        .scrollIntoView({
            behavior: "smooth"
        });
}



function showError(message) {

    document.getElementById(
        "resultCard"
    ).style.display = "block";


    document.getElementById(
        "operationTitle"
    ).textContent =
        "❌ Error";


    document.getElementById(
        "result"
    ).innerHTML = `

        <div class="error">

            ${escapeHTML(message)}

        </div>

    `;
}


</script>


</body>

</html>
